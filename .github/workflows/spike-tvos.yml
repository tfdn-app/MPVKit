name: Spike tvOS build

# Arnage #697: tvOS device + simulator slices for the player spike.
# No release, no tag: the artefact is downloaded by hand.
on:
  push:
    branches: [arnage-vo-tvos]

jobs:
  build:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          brew install autoconf
          brew install automake
          brew install libtool
          python -m pip install meson==1.4.2
          brew install ninja

      - name: Select Xcode
        run: |
          sudo xcode-select -s /Applications/Xcode_15.4.app/Contents/Developer
          xcodebuild -showsdks

      # LGPL only (no enable-gpl), like build.yml. `platform=tvos` expands to
      # the device and the simulator slices (ArgumentOptions.parse, base.swift).
      - name: Build LGPL, tvOS
        run: make build platform=tvos version=0.41.0-arnage.9-tvos

      - uses: actions/upload-artifact@v4
        with:
          name: mpvkit-tvos
          path: |
            dist/release/*.xcframework.zip
            dist/release/*.xcframework.checksum.txt
          if-no-files-found: error
          retention-days: 30
